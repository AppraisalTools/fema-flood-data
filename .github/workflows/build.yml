name: Build flood lookup data

# Runs when:
#  - n8n publishes an "upload-..." release with a FEMA "NFHL Data-County" zip attached
#    (from the FEMA Flood Data Upload form or the FEMA Zip Trimmer page),
#  - a zip is committed to incoming/ (e.g. with GitHub Desktop), or
#  - on demand from the Actions tab.
# Each run processes EVERY waiting upload release, so several counties sent back-to-back are all handled
# even though GitHub only queues one extra run at a time. Uploaded zips are deleted afterwards.
on:
  release:
    types: [published]
  push:
    paths: ['incoming/**.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-flood-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all waiting upload releases
        run: |
          mkdir -p incoming
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName | select(startswith("upload-"))' > upload_tags.txt || true
          echo "Waiting uploads:"; cat upload_tags.txt
          while read -r tag; do
            [ -z "$tag" ] && continue
            mkdir -p "incoming/$tag"
            gh release download "$tag" --repo "$REPO" --pattern '*.zip' --dir "incoming/$tag" || echo "::warning::could not download $tag"
          done < upload_tags.txt
      - name: Process FEMA downloads
        run: |
          shopt -s nullglob globstar
          zips=(incoming/**/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Nothing to process"; exit 0; fi
          python3 scripts/build.py "${zips[@]}"
      - name: Commit updated data
        run: |
          git config user.name  "flood-data-bot"
          git config user.email "flood-data-bot@users.noreply.github.com"
          git rm -rq --cached --ignore-unmatch incoming/*.zip
          find incoming -mindepth 1 ! -name .gitkeep -exec rm -rf {} + 2>/dev/null || true
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update flood data ($(date +%Y-%m-%d))"
          git push
      - name: Delete processed upload releases
        if: success()
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || true
          done < upload_tags.txt
